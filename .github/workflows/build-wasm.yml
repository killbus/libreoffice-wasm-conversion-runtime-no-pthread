name: Build WASM

# Manual-only trigger. LibreOffice WASM builds take 2-4h+ on 4 cores and
# must not run on every push/PR. Use workflow_dispatch and pick a mode.
#
#   baseline         -- current untrimmed autogen.input + full patch.
#                      Validates the build pipeline itself + gate test on GHA.
#   conversion-only  -- LOK trim atoms (exports, then shims) plus the private
#                      bridge atom on top of the full baseline patch. Keeps
#                      baseline autogen.input by default so atoms are isolated from PENDING-VERIFY
#                      autogen switches (see input use_conversion_autogen).
#
# Artifacts (soffice.wasm/data/cjs) are uploaded, NEVER auto-pushed to LFS
# or auto-committed. Download, verify locally, then push manually.
#
# See .trellis/tasks/08-02-conversion-only-native-bridge/{prd,design,implement}.md

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: true
        type: choice
        default: baseline
        options:
          - baseline
          - conversion-only
      clean_build:
        description: 'CLEAN_BUILD=1 (full rebuild, slower)'
        required: false
        type: boolean
        default: false
      use_conversion_autogen:
        description: 'Swap in autogen.conversion-only.input (PENDING-VERIFY disables + LTO). Default false isolates LOK atoms on baseline autogen (4.2a).'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # GHA 6h cap is 360; leave a margin
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install WASM build system dependencies
        # build-wasm.sh's check_deps() skips apt install when its (incomplete)
        # command list is satisfied, which let gperf slip through and break
        # LibreOffice configure. Pre-install the full set here so the build
        # does not depend on check_deps catching every tool.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git cmake ninja-build \
            python3 python3-pip python3-dev python3-setuptools \
            autoconf automake bison ccache flex gawk gettext gperf nasm \
            libarchive-dev libcups2-dev libcurl4-openssl-dev \
            libfontconfig1-dev libfreetype6-dev libglib2.0-dev \
            libharfbuzz-dev libicu-dev libjpeg-dev liblcms2-dev \
            libpng-dev libssl-dev libtool libxml2-dev libxslt1-dev \
            pkg-config uuid-dev xsltproc zip unzip wget curl \
            ca-certificates xz-utils

      - name: Build TypeScript (dist for subprocess worker)
        run: npm run build

      - name: Configure build mode
        id: mode
        run: |
          echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          # Autogen and LOK atoms are independent levers (see CONVERSION-ONLY-TRIM.md).
          # CONVERSION_ONLY (Build step) applies exports+shims atoms.
          # use_conversion_autogen swaps PENDING-VERIFY autogen -- default false
          # so 4.2a isolates atoms on baseline autogen.input.
          if [ "${{ inputs.mode }}" = "conversion-only" ] \
             && [ "${{ inputs.use_conversion_autogen }}" = "true" ] \
             && [ -f build/autogen.conversion-only.input ]; then
            cp build/autogen.conversion-only.input build/autogen.input
            echo "Using conversion-only autogen.input (use_conversion_autogen=true)"
          else
            echo "Using baseline autogen.input (atoms may still apply via CONVERSION_ONLY)"
          fi

      - name: Cache LibreOffice source + emsdk
        id: cache-lo
        uses: actions/cache@v4
        with:
          path: |
            ~/libreoffice-wasm-build/libreoffice
            ~/libreoffice-wasm-build/emsdk
          # Bump the prefix when patch/autogen changes invalidate the cache.
          # CLEAN_BUILD input also forces a miss via restore-keys exclusion.
          key: ${{ runner.os }}-lo-24-8-emsdk-3.1.74-${{ inputs.mode }}-cag-${{ inputs.use_conversion_autogen }}-${{ hashFiles('build/patches/**', 'build/autogen.input', 'build/autogen.conversion-only.input') }}-${{ inputs.clean_build }}
          restore-keys: |
            ${{ runner.os }}-lo-24-8-emsdk-3.1.74-${{ inputs.mode }}-cag-${{ inputs.use_conversion_autogen }}-

      - name: Free disk space
        run: |
          df -h /
          # LO build needs ~50GB; reclaim what we can on the runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                     /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: Build LibreOffice WASM
        env:
          BUILD_JOBS: '4'
          SKIP_DEPS: '0'
          CLEAN_BUILD: ${{ inputs.clean_build && '1' || '0' }}
          # actions/cache restores a source tree with the previous reviewed
          # patch stack applied. Normalize tracked source, but preserve ignored
          # LibreOffice build outputs before replaying the active stack.
          RESET_PATCHED_SOURCE: '1'
          # conversion-only mode applies exports, shims, then the private bridge
          # on top of the consolidated baseline patch.
          CONVERSION_ONLY: ${{ inputs.mode == 'conversion-only' && '1' || '0' }}
        run: |
          # Never let an early compile failure upload checked-in LFS artifacts.
          rm -f wasm/soffice.*
          bash build/build-wasm.sh

      - name: Show produced artifacts
        run: ls -lh wasm/soffice.*

      # SubprocessConverter forks dist/subprocess.worker.cjs; runs against the
      # freshly built wasm/soffice.* (overwrites the LFS-checked-out copy).
      - name: Run conversion gate test against freshly built wasm
        run: npx vitest run tests/converter-gate.test.ts

      - name: Upload WASM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soffice-wasm-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            wasm/soffice.wasm
            wasm/soffice.data
            wasm/soffice.cjs
            wasm/soffice.js
            wasm/soffice.data.js.metadata
          retention-days: 14
          if-no-files-found: warn

      - name: Report sizes
        if: always()
        run: |
          echo "## WASM build (${{ inputs.mode }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| file | size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in wasm/soffice.wasm wasm/soffice.data wasm/soffice.cjs; do
            if [ -f "$f" ]; then
              echo "| $f | $(du -h "$f" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
