name: Build no-pthread WASM

# Manual-only: a native LibreOffice WASM build can consume several hours.
# This fork has one conversion-only, no-pthread profile. Artifacts are uploaded
# for qualification and are never committed or pushed automatically.
on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Discard cached build outputs and rebuild from scratch'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  LIBREOFFICE_VERSION: libreoffice-24-8
  LIBREOFFICE_COMMIT: d1c9e0e4e1ddeb24fe8f93e56860b3765043f8b1
  EMSDK_VERSION: 3.1.74

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout without historical LFS runtime bytes
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: bash scripts/retry-command.sh npm ci

      - name: Install WASM build dependencies
        run: |
          bash scripts/retry-command.sh sudo apt-get update
          bash scripts/retry-command.sh sudo apt-get install -y --no-install-recommends \
            build-essential git cmake ninja-build \
            python3 python3-pip python3-dev python3-setuptools \
            autoconf automake bison ccache flex gawk gettext gperf nasm \
            libarchive-dev libcups2-dev libcurl4-openssl-dev \
            libfontconfig1-dev libfreetype6-dev libglib2.0-dev \
            libharfbuzz-dev libicu-dev libjpeg-dev liblcms2-dev \
            libpng-dev libssl-dev libtool libxml2-dev libxslt1-dev \
            pkg-config uuid-dev xsltproc zip unzip wget curl \
            ca-certificates xz-utils

      - name: Build JavaScript bundles
        run: node scripts/build-js-bundles.mjs

      - name: Cache pinned LibreOffice source and Emscripten
        uses: actions/cache@v4
        with:
          path: |
            ~/libreoffice-wasm-build/libreoffice
            ~/libreoffice-wasm-build/emsdk
          key: ${{ runner.os }}-lo-${{ env.LIBREOFFICE_COMMIT }}-emsdk-${{ env.EMSDK_VERSION }}-no-pthread-${{ hashFiles('build/patches/**', 'build/autogen.input', 'build/build-wasm.sh', 'scripts/inspect-no-pthread-runtime.mjs') }}-${{ inputs.clean_build }}
          restore-keys: |
            ${{ runner.os }}-lo-${{ env.LIBREOFFICE_COMMIT }}-emsdk-${{ env.EMSDK_VERSION }}-no-pthread-

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: Build LibreOffice WASM
        env:
          BUILD_JOBS: '4'
          SKIP_DEPS: '0'
          CLEAN_BUILD: ${{ inputs.clean_build && '1' || '0' }}
          RESET_PATCHED_SOURCE: '1'
        run: |
          rm -f wasm/soffice.*
          bash build/build-wasm.sh

      - name: Verify no-pthread runtime contract
        run: npm run verify:no-pthread

      - name: Run fresh native conversion gate
        run: npx vitest run tests/converter-gate.test.ts

      - name: Upload no-pthread WASM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soffice-wasm-no-pthread-${{ github.run_id }}
          path: |
            wasm/soffice.wasm
            wasm/soffice.data
            wasm/soffice.cjs
            wasm/soffice.js
            wasm/soffice.data.js.metadata
          retention-days: 14
          if-no-files-found: warn

      - name: Report sizes
        if: always()
        run: |
          echo '## WASM build (conversion-only, no-pthread)' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| file | size |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          for file in wasm/soffice.wasm wasm/soffice.data wasm/soffice.cjs; do
            if [ -f "$file" ]; then
              echo "| $file | $(du -h "$file" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
