name: Build no-pthread WASM

# Manual-only: a native LibreOffice WASM build can consume several hours.
# This fork has one conversion-only, no-pthread profile. Artifacts are uploaded
# for qualification and are never committed or pushed automatically.
on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Discard cached build outputs and rebuild from scratch"
        required: false
        type: boolean
        default: true
      artifact_run_id:
        description: "Reuse WASM artifacts from this workflow run and run qualification only"
        required: false
        type: string
        default: ""
      stage_release_candidate:
        description: "After reused-artifact qualification, stage the frozen candidate as a draft Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

env:
  LIBREOFFICE_VERSION: libreoffice-24-8
  LIBREOFFICE_COMMIT: d1c9e0e4e1ddeb24fe8f93e56860b3765043f8b1
  EMSDK_VERSION: 3.1.74

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout without historical LFS runtime bytes
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: bash scripts/retry-command.sh npm ci

      - name: Install WASM build dependencies
        run: |
          bash scripts/retry-command.sh sudo apt-get update
          bash scripts/retry-command.sh sudo apt-get install -y --no-install-recommends \
            build-essential git cmake ninja-build \
            python3 python3-pip python3-dev python3-setuptools \
            autoconf automake bison ccache flex gawk gettext gperf nasm \
            libarchive-dev libcups2-dev libcurl4-openssl-dev \
            libfontconfig1-dev libfreetype6-dev libglib2.0-dev \
            libharfbuzz-dev libicu-dev libjpeg-dev liblcms2-dev \
            libpng-dev libssl-dev libtool libxml2-dev libxslt1-dev \
            pkg-config uuid-dev xsltproc zip unzip wget curl \
            ca-certificates xz-utils fonts-noto-cjk fontconfig fonttools poppler-utils

      - name: Build JavaScript bundles
        run: node scripts/build-js-bundles.mjs

      - name: Cache pinned LibreOffice source and Emscripten
        if: ${{ inputs.artifact_run_id == '' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/libreoffice-wasm-build/libreoffice
            ~/libreoffice-wasm-build/emsdk
          key: ${{ runner.os }}-lo-${{ env.LIBREOFFICE_COMMIT }}-emsdk-${{ env.EMSDK_VERSION }}-no-pthread-${{ hashFiles('build/patches/**', 'build/autogen.input', 'build/build-wasm.sh', 'scripts/inspect-no-pthread-runtime.mjs') }}-${{ inputs.clean_build }}
          restore-keys: |
            ${{ runner.os }}-lo-${{ env.LIBREOFFICE_COMMIT }}-emsdk-${{ env.EMSDK_VERSION }}-no-pthread-

      - name: Free disk space
        if: ${{ inputs.artifact_run_id == '' }}
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: Build LibreOffice WASM
        if: ${{ inputs.artifact_run_id == '' }}
        env:
          BUILD_JOBS: "4"
          SKIP_DEPS: "0"
          CLEAN_BUILD: ${{ inputs.clean_build && '1' || '0' }}
          RESET_PATCHED_SOURCE: "1"
        run: |
          rm -f wasm/soffice.*
          bash build/build-wasm.sh

      - name: Download prebuilt WASM artifacts
        if: ${{ inputs.artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: soffice-wasm-no-pthread-${{ inputs.artifact_run_id }}
          path: wasm
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}

      - name: Validate release-staging inputs
        if: ${{ inputs.stage_release_candidate }}
        run: |
          set -euo pipefail
          test -n "${{ inputs.artifact_run_id }}"

      - name: Resolve runtime provenance
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$ARTIFACT_RUN_ID" ]; then
            NATIVE_BUILD_HEAD_SHA="$(bash scripts/retry-command.sh gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}" --jq .head_sha)"
            NATIVE_BUILD_RUN_ID="$ARTIFACT_RUN_ID"
            QUALIFICATION_BUILD_MODE="reused-artifact"
          else
            NATIVE_BUILD_HEAD_SHA="$GITHUB_SHA"
            NATIVE_BUILD_RUN_ID="$GITHUB_RUN_ID"
            if [ "${{ inputs.clean_build }}" = "true" ]; then
              QUALIFICATION_BUILD_MODE="fresh-clean"
            else
              QUALIFICATION_BUILD_MODE="fresh-incremental"
            fi
          fi
          {
            echo "NATIVE_BUILD_HEAD_SHA=$NATIVE_BUILD_HEAD_SHA"
            echo "NATIVE_BUILD_RUN_ID=$NATIVE_BUILD_RUN_ID"
            echo "QUALIFICATION_BUILD_MODE=$QUALIFICATION_BUILD_MODE"
          } >> "$GITHUB_ENV"

      - name: Verify no-pthread runtime contract
        run: npm run verify:no-pthread

      - name: Run fresh native conversion gate
        run: npx vitest run tests/converter-gate.test.ts

      - name: Stage CJK qualification font
        run: |
          set -euo pipefail
          FONT_PATH="$(find /usr/share/fonts -type f -iname 'NotoSansCJK-Regular.ttc' -print -quit)"
          test -n "$FONT_PATH"
          mkdir -p tests/fixtures-ci
          cp "$FONT_PATH" tests/fixtures-ci/NotoSansCJK-Regular.ttc
          pyftsubset "$FONT_PATH" --font-number=2 \
            --unicodes=U+0020,U+0041,U+4E2D \
            --layout-features='*' --glyph-names --symbol-cmap --legacy-cmap \
            --notdef-glyph --notdef-outline --recommended-glyphs \
            --name-IDs='*' --name-legacy --name-languages='*' \
            --output-file=tests/fixtures-ci/NotoSansCJK-Profile-A.otf
          pyftsubset "$FONT_PATH" --font-number=2 \
            --unicodes=U+0020,U+0041,U+6587 \
            --layout-features='*' --glyph-names --symbol-cmap --legacy-cmap \
            --notdef-glyph --notdef-outline --recommended-glyphs \
            --name-IDs='*' --name-legacy --name-languages='*' \
            --output-file=tests/fixtures-ci/NotoSansCJK-Profile-B.otf
          test "$(fc-scan --format='%{family[0]}|%{style[0]}' tests/fixtures-ci/NotoSansCJK-Profile-A.otf)" = \
            "$(fc-scan --format='%{family[0]}|%{style[0]}' tests/fixtures-ci/NotoSansCJK-Profile-B.otf)"
          test "$(sha256sum tests/fixtures-ci/NotoSansCJK-Profile-A.otf | cut -d' ' -f1)" != \
            "$(sha256sum tests/fixtures-ci/NotoSansCJK-Profile-B.otf | cut -d' ' -f1)"

      - name: Install Chromium for runtime qualification
        run: npx playwright install --with-deps chromium

      - name: Qualify dynamic font-profile lifecycle
        run: npx playwright test tests/browser/font-profile-lifecycle.spec.ts --project=chromium --workers=1

      - name: Upload qualified no-pthread WASM artifacts
        if: ${{ success() && inputs.artifact_run_id == '' && inputs.clean_build }}
        uses: actions/upload-artifact@v4
        with:
          name: soffice-wasm-no-pthread-${{ github.run_id }}
          path: |
            wasm/soffice.wasm
            wasm/soffice.data
            wasm/soffice.cjs
            wasm/soffice.js
            wasm/soffice.data.js.metadata
            wasm/font-profile-qualification.json
            wasm/font-profile-fault-qualification.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload reused-artifact qualification evidence
        if: ${{ success() && inputs.artifact_run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: requalified-soffice-wasm-no-pthread-${{ github.run_id }}
          path: |
            wasm/font-profile-qualification.json
            wasm/font-profile-fault-qualification.json
          retention-days: 7
          if-no-files-found: error

      - name: Stage qualified runtime draft Release
        if: ${{ success() && inputs.artifact_run_id != '' && inputs.stage_release_candidate }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-runtime/stage-draft.mjs \
            --native-root wasm \
            --wrapper-root . \
            --work-root "$RUNNER_TEMP/runtime-release" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$NATIVE_BUILD_HEAD_SHA" \
            --spec scripts/release-runtime/pending-candidate-spec.json \
            --expected-candidate-id 85a039aba424bedba15c75728d071aeaa678314ae4e161e88394674755009190

      - name: Upload failed-build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-soffice-wasm-no-pthread-${{ github.run_id }}
          path: |
            wasm/font-profile-qualification.json
            wasm/font-profile-fault-qualification.json
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore

      - name: Report sizes
        if: always()
        run: |
          echo '## WASM build (conversion-only, no-pthread)' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| file | size |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          for file in wasm/soffice.wasm wasm/soffice.data wasm/soffice.cjs; do
            if [ -f "$file" ]; then
              echo "| $file | $(du -h "$file" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
