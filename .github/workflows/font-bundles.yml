name: Font Bundles

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach font bundles to (e.g., v2.5.0)'
        required: true

jobs:
  build-font-bundles:
    # Semantic release-trigger isolation (see .trellis/tasks/08-10-.../design.md §6):
    #   - keep deliberate manual dispatch working;
    #   - for release.published, run the font --clobber upload loop only for
    #     semantic-package tags (v<semver>); deny runtime-artifact-*, empty and
    #     malformed tags so a dedicated runtime release can never reach it;
    #   - decision mirror in scripts/release-runtime/lib/workflow-decision.mjs
    #     is covered by tests/release-runtime/workflow-guard.test.ts.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && contains(github.event.release.tag_name, '.') && !contains(github.event.release.tag_name, 'runtime')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Build font bundles
        run: ./scripts/package-fonts.sh

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload font bundles to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Uploading font bundles to release ${TAG}..."
          for zip in fonts/fonts-*.zip; do
            echo "  Uploading $(basename "$zip")..."
            gh release upload "$TAG" "$zip" --clobber
          done
          echo "Done."
