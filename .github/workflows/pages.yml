name: Deploy WASM to GitHub Pages

# Publishes the browser runtime assets (dist/ + wasm/) to GitHub Pages so they can
# be loaded cross-origin. GitHub Pages serves every file with
# `Access-Control-Allow-Origin: *`, which is what browsers require to fetch the
# LibreOffice WASM binaries (soffice.wasm / soffice.data) from another origin.
#
# Deploying via the Pages *artifact* (instead of committing to a branch) sidesteps
# the 100 MB per-file git limit, so the ~140 MB soffice.wasm can be published.
#
# The site serves the currently published release only. Consumers should pin their
# local JS glue (dist/) to the same version they load the binaries for.

on:
  release:
    types: [published]
  workflow_dispatch:

# Least-privilege token: only what the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one Pages deployment at a time; never cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Semantic release-trigger isolation (see .trellis/tasks/08-10-.../design.md §6):
    #   - keep deliberate manual dispatch working;
    #   - for release.published, deploy Pages only for strict semantic-package
    #     tags (v<major>.<minor>.<patch>, optionally -pre/+build). This
    #     job-level `if:` is a coarse structural gate (dispatch allowed; release
    #     only for tags that start with "v", contain a ".", and do not contain
    #     the runtime namespace). GitHub expressions cannot express a regex, so
    #     the strict allow-list and the runtime-namespace denial are enforced
    #     fail-closed by the first repository-local command after checkout
    #     (guard-release-tag.mjs), which uses the same executable oracle
    #     (lib/workflow-decision.mjs) that the acceptance probe matrix checks.
    #     Malformed tags (vfoo.bar, v1.x, v1..2, v1.2) and anything in the
    #     runtime namespace must fail that step.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && contains(github.event.release.tag_name, '.') && !contains(github.event.release.tag_name, 'runtime')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (without Git LFS)
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Enforce strict semantic-version release tag (fail closed)
        if: github.event_name == 'release'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-runtime/guard-release-tag.mjs "$GITHUB_EVENT_NAME" "$GITHUB_RELEASE_TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore qualified runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run runtime:restore

      - name: Install dependencies
        run: npm ci

      - name: Build browser bundle (dist/)
        run: npm run build

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          rm -rf _site
          mkdir -p _site
          # Mirror the npm package browser layout so consumers can use the same paths.
          cp -R dist _site/dist
          cp -R wasm _site/wasm
          # Disable Jekyll so files are served verbatim (and nothing is dropped).
          touch _site/.nojekyll
          # Version marker (the landing page fetches this to show the version).
          printf '{ "version": "%s" }\n' "$VERSION" > _site/version.json
          # Landing page + demo (source: pages/). No cross-origin isolation shim is needed.
          cp pages/index.html _site/index.html
          echo "Assembled site:"
          du -sh _site
          du -h _site/wasm/soffice.wasm _site/wasm/soffice.data

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
